name: Package and release

# Build the addon and publish it to CurseForge whenever a version tag is pushed,
# e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

# contents: write lets the packager also publish a GitHub release with the zip.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the packager can build the changelog and find the
          # previous tag.
          fetch-depth: 0

      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          # Add this in: repo Settings -> Secrets and variables -> Actions.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Provided automatically by Actions; used to create the GitHub release.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
